<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الاستمارات حصرياً</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .custom-scroll::-webkit-scrollbar { width:6px; height:6px; }
        .custom-scroll::-webkit-scrollbar-track { background:#f8fafc; }
        .custom-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background:#94a3b8; }

        /* A4 Paper Styles */
        .a4-paper { width: 210mm; min-height: 290mm; background: white; padding: 15mm; position: relative; overflow: hidden; box-shadow: 0 0 15px rgba(0,0,0,0.2); margin: 0 auto; direction: rtl; }
        .a4-paper * { box-sizing: border-box; }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.10; pointer-events: none; z-index: 0; width: 600px; height:600px; }
        .watermark img { width: 100%; height: 100%; object-fit: contain; }
        .content { position: relative; z-index: 1; }
        .a4-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c41e3a; padding-bottom: 12px; margin-bottom: 18px; position: relative; z-index: 1; }
        .header-left, .header-right { text-align: center; flex: 1; }
        .header-center { flex: 0 0 120px; text-align: center; display: flex; justify-content: center; align-items: center; }
        .a4-header h2 { font-size: 15px; font-weight: 700; color: #000; margin: 2px 0; }
        .a4-header h3 { font-size: 13px; font-weight: 600; color: #333; margin: 2px 0; }
        .header-logo { width: 100px; height: 100px; object-fit: contain; }
        .title { text-align: center; font-size: 18px; font-weight: 700; margin: 20px 0; color: #000; }
        .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 15px; }
        .form-group { display: flex; align-items: center; gap: 8px; flex: 1; margin-bottom: 0; }
        .form-group.full-width { width: 100%; }
        .form-group label { font-weight: 600; font-size: 13px; white-space: nowrap; color: #000; margin-bottom: 0; display: block; }
        .form-group input[type="text"] { flex: 1; padding: 6px 10px; border: 2px solid #333; border-radius: 5px; font-size: 13px; font-family: 'Cairo', sans-serif; min-width: 120px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(2px); text-align: center; color: #000; }
        .signatures-section { display: flex; justify-content: space-between; margin: 25px 0; gap: 25px; position: relative; z-index: 1; }
        .signature-box { text-align: center; width: 50%; border: 2px dashed #333; border-radius: 12px; padding: 12px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(1px); }
        .signature-line { height: 80px; margin-bottom: 6px; position: relative; background: rgba(255, 255, 255, 0.1); }
        .signature-label { font-weight: 600; font-size: 12px; color: #000; margin-top: 4px; }
        .notes-section { margin-top: 80px; padding: 12px; background: rgba(255, 255, 255, 0.3); border: 1px solid #ddd; border-radius: 5px; position: relative; z-index: 1; backdrop-filter: blur(1px); }
        .notes-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
        .notes-list { list-style: none; font-size: 12px; line-height: 1.8; padding: 0; margin: 0; }
        .notes-list li::before { content: "◆ "; color: #c41e3a; }
        .footer-code { text-align: left; font-size: 10px; color: #666; margin-top: 15px; font-family: monospace; }
        
        @media print {
            body * { visibility: hidden; }
            #form-details-modal, #form-details-modal * { visibility: visible; }
            #form-details-modal { position: absolute; left: 0; top: 0; width: 100%; background: white; }
            .a4-paper { width: 100%; box-shadow: none; margin: 0; padding: 0; }
            button, .fa-xmark { display: none !important; }
            .form-group input { border: 2px solid #333 !important; background: rgba(255, 255, 255, 0.3) !important; text-align: center !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .signature-box { border: 2px dashed #333 !important; background: rgba(255, 255, 255, 0.2) !important; }
            .notes-section { background: rgba(255, 255, 255, 0.3) !important; border: 1px solid #ddd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .watermark { opacity: 0.08 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center gap-3">
            <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-100">
                <i class="fa-solid fa-file-signature text-2xl text-amber-600"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800">لوحة الاستمارات الواردة</h1>
                <p class="text-sm text-slate-500 mt-0.5">متابعة وعرض طلبات الاستمارات بشكل حي ومباشر</p>
            </div>
        </div>
        <div class="flex items-center flex-wrap gap-2 w-full md:w-auto">
            <div id="sync-badge" class="bg-amber-50 border border-amber-200 text-amber-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5">
                <i class="fa-solid fa-spinner fa-spin text-amber-500"></i>
                جاري الاتصال...
            </div>
            <div class="bg-amber-100 text-amber-800 border border-amber-200 rounded-xl px-3 py-2 text-sm font-bold shadow-sm">
                عدد الاستمارات: <span id="forms-count-badge">0</span>
            </div>
        </div>
    </header>

    <!-- Main Table -->
    <main class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="overflow-x-auto custom-scroll border border-slate-100 rounded-xl shadow-sm">
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="text-slate-600 font-bold border-b border-slate-200 bg-slate-50/70 text-xs">
                        <th class="px-4 py-3.5">ت</th>
                        <th class="px-4 py-3.5">تاريخ التقديم</th>
                        <th class="px-4 py-3.5">نوع الاستمارة</th>
                        <th class="px-4 py-3.5">مقدم الطلب</th>
                        <th class="px-4 py-3.5">رقم الموبايل</th>
                        <th class="px-4 py-3.5">الدائرة/الجهة</th>
                        <th class="px-4 py-3.5 text-center">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="forms-table-body" class="divide-y divide-slate-100">
                    <tr><td colspan="7" class="text-center py-6 text-slate-400">جاري تحميل الاستمارات...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="forms-no-data" class="hidden text-center py-12 text-slate-400 font-semibold bg-slate-50/30 rounded-xl mt-4 border border-dashed border-slate-200">
            <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-300 block"></i>
            لا توجد استمارات واردة حالياً.
        </div>
    </main>

    <!-- Form Details Modal -->
    <div id="form-details-modal" class="fixed inset-0 z-50 hidden flex justify-center items-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-white border border-slate-100 rounded-2xl w-full max-w-4xl max-h-[92vh] overflow-y-auto custom-scroll shadow-2xl z-10 flex flex-col">
            <div class="flex justify-between items-center p-5 border-b border-amber-100 bg-amber-50/40 sticky top-0">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-amber-600"></i>
                    تفاصيل الاستمارة
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 transition-colors p-1.5 rounded-lg hover:bg-slate-100">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4 text-slate-800" id="modal-content">
                <!-- Content injected via JS -->
            </div>
            <div class="p-5 border-t border-slate-100 bg-slate-50 flex justify-end">
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-print"></i>
                    طباعة التفاصيل
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // ======= CONFIGURATION =======
        const firebaseConfig = {
          apiKey: "AIzaSyAdKLNZenjeOjMPez9-XXzbCA5wBw8WfAg",
          authDomain: "mawkei.firebaseapp.com",
          projectId: "mawkei",
          storageBucket: "mawkei.firebasestorage.app",
          messagingSenderId: "302655443025",
          appId: "1:302655443025:web:b06312faf0e1782f7c6870"
        };
        // ==============================

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allSubmittedForms = [];

        // Start listening to forms only
        function startFormsSync() {
            const syncBadge = document.getElementById('sync-badge');
            
            db.collection('ministry_employees')
                .onSnapshot((snapshot) => {
                    const forms = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        // Only add if it's a form
                        if (data.formType || data.formName) {
                            forms.push({ firestoreId: doc.id, ...data });
                        }
                    });

                    // Robust sorting by timestamp
                    forms.sort((a, b) => {
                        let timeA = 0, timeB = 0;
                        try {
                            if (a.timestamp) {
                                if (typeof a.timestamp.toMillis === 'function') timeA = a.timestamp.toMillis();
                                else if (typeof a.timestamp.toDate === 'function') timeA = a.timestamp.toDate().getTime();
                                else timeA = new Date(a.timestamp).getTime() || 0;
                            }
                            if (b.timestamp) {
                                if (typeof b.timestamp.toMillis === 'function') timeB = b.timestamp.toMillis();
                                else if (typeof b.timestamp.toDate === 'function') timeB = b.timestamp.toDate().getTime();
                                else timeB = new Date(b.timestamp).getTime() || 0;
                            }
                        } catch(e) {
                            console.error("Sorting error:", e);
                        }
                        return timeB - timeA;
                    });

                    allSubmittedForms = forms;
                    document.getElementById('forms-count-badge').innerText = forms.length;
                    renderFormsTable(forms);

                    if (syncBadge) {
                        syncBadge.innerHTML = '<i class="fa-solid fa-circle text-emerald-500 text-xs animate-pulse"></i> متصل';
                        syncBadge.className = 'bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5';
                    }
                }, (error) => {
                    console.error('Firestore listener error:', error);
                    if (syncBadge) {
                        syncBadge.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-500"></i> غير متصل';
                        syncBadge.className = 'bg-red-50 border border-red-200 text-red-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5';
                    }
                });
        }

        // Render table
        function renderFormsTable(forms) {
            const tbody = document.getElementById('forms-table-body');
            const noData = document.getElementById('forms-no-data');
            tbody.innerHTML = '';

            if (!forms || forms.length === 0) {
                noData.classList.remove('hidden');
                return;
            }
            noData.classList.add('hidden');

            forms.forEach((form, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors cursor-pointer';
                let ts = 'غير متوفر';
                try {
                    if (form.timestamp) {
                        if (typeof form.timestamp.toDate === 'function') {
                            ts = new Date(form.timestamp.toDate()).toLocaleString('ar-IQ');
                        } else {
                            ts = new Date(form.timestamp).toLocaleString('ar-IQ');
                        }
                    }
                } catch(e) {
                    console.error("Date formatting error:", e);
                }
                
                const formType = form.formType || form.formName || 'غير معروف';
                const applicantName = form.name || form.fullName || form.fullname || form.authName || '-';
                const phone = form.mobileNumber || form.mobile || form.phone || '-';
                const department = form.department || form.circleName || form.organizer || '-';

                tr.innerHTML = `
                    <td class="px-4 py-3 font-bold text-slate-400 text-xs">${idx+1}</td>
                    <td class="px-4 py-3 font-bold text-slate-600 text-xs" dir="ltr">${ts}</td>
                    <td class="px-4 py-3 font-bold text-amber-700 text-xs">${formType}</td>
                    <td class="px-4 py-3 font-bold text-slate-800 text-xs">${applicantName}</td>
                    <td class="px-4 py-3 text-slate-600 text-xs" dir="ltr">${phone}</td>
                    <td class="px-4 py-3 text-slate-600 font-medium text-xs">${department}</td>
                    <td class="px-4 py-3 text-center flex justify-center gap-2">
                        <button onclick="openFormDetails('${form.firestoreId}')" class="bg-white hover:bg-amber-50 text-amber-600 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm active:scale-95 transition-all text-xs font-bold">
                            <i class="fa-regular fa-eye text-xs"></i> عرض
                        </button>
                        <button onclick="deleteForm('${form.firestoreId}')" class="bg-white hover:bg-red-50 text-red-600 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm active:scale-95 transition-all text-xs font-bold">
                            <i class="fa-solid fa-trash-can text-xs"></i> حذف
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Translation dictionary for common keys
        const fieldTranslations = {
            "formType": "نوع الاستمارة",
            "formName": "نوع الاستمارة",
            "fullname": "الاسم الكامل",
            "fullName": "الاسم الكامل",
            "name": "الاسم",
            "english_name": "الاسم بالانجليزية",
            "idNumber": "رقم الهوية",
            "department": "القسم/الدائرة/الاتحاد",
            "circleName": "اسم الدائرة",
            "mobile": "رقم الموبايل",
            "mobileNumber": "رقم الموبايل",
            "phone": "رقم الموبايل",
            "jobtitle": "العنوان الوظيفي",
            "chassisNumber": "رقم الشاصي",
            "authType": "نوع التخويل",
            "activityType": "نوع النشاط",
            "organizer": "الجهة المنظمة",
            "hostEntity": "الجهة المستضيفة",
            "participants": "عدد المشاركين",
            "mediaChannels": "القنوات الإعلامية المرافقة",
            "entryExit": "نوع الحركة (إدخال/إخراج)",
            "driverName": "اسم السائق",
            "vehicleNumber": "رقم العجلة",
            "vehicleType": "نوع العجلة",
            "vehicleColor": "لون العجلة",
            "details": "تفاصيل إضافية",
            "timestamp": "تاريخ ووقت الإرسال"
        };

        function translateKey(key) {
            return fieldTranslations[key] || key;
        }

        // Open Modal
        function openFormDetails(formId) {
            const form = allSubmittedForms.find(f => String(f.firestoreId) === String(formId));
            if (!form) return;

            const modal = document.getElementById('form-details-modal');
            const content = document.getElementById('modal-content');
            
            // Safe values extractor
            const val = (key) => {
                if (form[key]) return form[key];
                return "";
            };

            const html = `
            <div class="a4-paper" id="formContent">
                <!-- Watermark -->
                <div class="watermark">
                    <img src="imag.jpg" alt="شعار وزارة الشباب والرياضة" onerror="this.style.display='none'">
                </div>

                <div class="content">
                    <!-- Header Section -->
                    <div class="a4-header">
                        <div class="header-right">
                            <h2>جمهورية العراق</h2>
                            <h2>وزارة الشباب والرياضة</h2>
                            <h3>مكتب الوزير</h3>
                            <h3>قسم التصاريح الامنية</h3>
                        </div>

                        <div class="header-center">
                            <img src="imag.jpg" alt="شعار وزارة الشباب والرياضة" class="header-logo" onerror="this.style.display='none'">
                        </div>

                        <div class="header-left">
                            <h2>Republic of Iraq</h2>
                            <h2>Ministry Of Youth & Sport</h2>
                            <h3>Minister Office</h3>
                            <h3>Security Permits Department</h3>
                        </div>
                    </div>

                    <!-- Title -->
                    <div class="title">تصريح اقامة انشطة داخل المنشآت التابعة للوزارة</div>

                    <!-- Form Fields -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>اسم المخول الثلاثي:</label>
                            <input type="text" value="${val('fullname') || val('fullName') || val('name')}" readonly>
                        </div>
                        <div class="form-group">
                            <label>رقم هوية المخول:</label>
                            <input type="text" value="${val('idNumber')}" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>نوع النشاط:</label>
                            <input type="text" value="${val('activityType')}" readonly>
                        </div>
                        <div class="form-group">
                            <label>الجهة المقيمة للنشاط:</label>
                            <input type="text" value="${val('organizer')}" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>الجهة المستضيفة للنشاط:</label>
                            <input type="text" value="${val('hostEntity')}" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>عدد المشاركين في النشاط:</label>
                            <input type="text" value="${val('participants')}" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>وجود قنوات اعلامية تذكر القنوات:</label>
                            <input type="text" value="${val('mediaChannels')}" readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>رقم هاتف المخول:</label>
                            <input type="text" value="${val('mobile') || val('phoneNumber')}" readonly>
                        </div>
                    </div>

                    <!-- Signatures Section -->
                    <div class="signatures-section">
                        <div class="signature-box">
                            <div class="signature-line"></div>
                            <div class="signature-label">ختم وتوقيع المدير العام</div>
                        </div>
                        <div class="signature-box">
                            <div class="signature-line"></div>
                            <div class="signature-label">ختم وتوقيع قسم التصاريح الامنية</div>
                        </div>
                    </div>

                    <!-- Notes Section -->
                    <div class="notes-section">
                        <div class="notes-title">ملاحظة :-</div>
                        <ul class="notes-list">
                            <li>ارفاق كتاب رسمي صادر من الجهة المعنية.</li>
                            <li>صورة من هوية المخول وسنوية العجلة ان وجدت.</li>
                            <li>يتحمل المخول مسؤولية الاشخاص الداخلين الى مقر الوزارة لحين خروجهم.</li>
                            <li>يمنع ادخال واخراج المواد بالنشاط خارج اوقات الدوام الرسمي والعطل الرسمية.</li>
                        </ul>
                    </div>

                    <div class="footer-code">O-Qp-02-03-02-20SEP-2024</div>
                </div>
            </div>`;
            
            content.innerHTML = html;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('form-details-modal').classList.add('hidden');
        }

        // Delete Form Function
        function deleteForm(formId) {
            if (confirm('هل أنت متأكد من حذف هذه الاستمارة نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) {
                db.collection('ministry_employees').doc(formId).delete().then(() => {
                    // No need to manually refresh the table since onSnapshot is listening
                }).catch((error) => {
                    console.error("Error removing document: ", error);
                    alert("حدث خطأ أثناء الحذف: " + error.message);
                });
            }
        }

        // Start on load
        window.addEventListener('DOMContentLoaded', () => {
            startFormsSync();
        });
    </script>
</body>
</html>
